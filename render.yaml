services:
  - type: web
    name: joshua-kimmich-archive
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/archive-data
      - key: STORAGE_PROVIDER
        value: local
      - key: PRIVATE_AUTO_LOGIN
        value: "false"
      - key: LOCAL_RESET_LINKS
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
